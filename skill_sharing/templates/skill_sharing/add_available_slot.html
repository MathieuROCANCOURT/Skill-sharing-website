{% extends "base.html" %}

{% block title %}Entraide - Ajouter une disponibilité{% endblock %}

{% block content %}
{% if error_message %}
<p class="error_message">{{ error_message }}</p>
{% endif %}
<form action="{% url 'skill_sharing:add_available_slot' %}" method="post">
    {% csrf_token %}
    <table>
        <thead>
        <th colspan="2" style="text-align: center">AJOUTER UNE DISPONIBILITÉ</th>
        </thead>
        {{ form.as_table }}
    </table>


    <input type="submit" value="Add">
</form>
{% endblock %}
